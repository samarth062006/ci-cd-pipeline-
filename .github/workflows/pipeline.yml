name: Beginner CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hello-cloud-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download code onto runner
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 3. Install app dependencies
        run: npm ci

      - name: 4. Run automated tests
        run: npm test

      - name: 5. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 7. Trigger cloud deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          echo "Deploying ${{ env.IMAGE_NAME }}:latest"
          curl -fsSL -X POST "$DEPLOY_HOOK"
